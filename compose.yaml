services:
  frontend:
    image: taskflow-frontend:v2
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: taskflow-backend:v1
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgres://taskflow:lab_password@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: taskflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
